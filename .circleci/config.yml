version: 2.1
jobs:
  build:
    docker:
      - image: cimg/base:current-22.04
    resource_class: medium
    steps:
      - checkout
      - restore_cache:
          keys:
            - deps-{{ checksum "build.py" }}
      - run:
          name: Build CubicSDR
          command: python3 build.py --modules none
      - save_cache:
          key: deps-{{ checksum "build.py" }}
          paths:
            - build/deps
