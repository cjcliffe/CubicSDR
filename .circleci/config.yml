version: 2.1
jobs:
  build:
    docker:
      - image: cimg/base:current-24.04
    resource_class: medium
    steps:
      - checkout
      - restore_cache:
          keys:
            - deps-{{ checksum "build.py" }}
      - run:
          name: Install Dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y build-essential cmake git autoconf automake libtool pkg-config libpulse-dev libgtk-3-dev freeglut3-dev libhamlib-dev libwxgtk3.2-dev libsoapysdr-dev soapysdr-tools
      - run:
          name: Build CubicSDR
          command: python3 build.py --modules none
      - save_cache:
          key: deps-{{ checksum "build.py" }}
          paths:
            - build/deps
  appimage:
    docker:
      - image: cimg/base:current-22.04
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Install Dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y build-essential cmake git autoconf automake libtool pkg-config libpulse-dev libgtk-3-dev freeglut3-dev libhamlib-dev
      - run:
          name: Build AppImage
          command: python3 build.py --modules none --build-deps --package appimage
      - store_artifacts:
          path: build/CubicSDR-x86_64.AppImage
workflows:
  version: 2
  build:
    jobs:
      - build:
          filters:
            tags:
              ignore: /.*/
      - appimage:
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /.*/
