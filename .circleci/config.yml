version: 2.1
jobs:
  build:
    docker:
      - image: cimg/base:current-24.04
    resource_class: medium
    steps:
      - checkout
      - restore_cache:
          keys:
            - deps-{{ checksum "build.py" }}
      - run:
          name: Install Dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y build-essential cmake git autoconf automake libtool pkg-config libpulse-dev libgtk-3-dev freeglut3-dev libhamlib-dev libwxgtk3.2-dev libsoapysdr-dev soapysdr-tools
      - run:
          name: Build CubicSDR
          command: python3 build.py --modules none
      - save_cache:
          key: deps-{{ checksum "build.py" }}
          paths:
            - build/deps
  appimage:
    docker:
      - image: cimg/base:current-22.04
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Install Dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y build-essential cmake git autoconf automake libtool pkg-config libpulse-dev libgtk-3-dev freeglut3-dev libhamlib-dev zlib1g-dev libudev-dev libsqlite3-dev libncurses-dev
      - run:
          name: Build AppImage
          command: python3 build.py --build-deps --package appimage
      - run:
          name: Inspect bundled module linkage
          command: |
            ./build/CubicSDR-x86_64.AppImage --appimage-extract
            for mod in squashfs-root/usr/bin/modules/*.so; do echo "== $mod"; readelf -d "$mod" | grep -E 'NEEDED|RPATH|RUNPATH' || true; done
            echo '--- device libs present in AppDir: ---'
            ls squashfs-root/usr/lib/ | grep -iE 'soapy|airspy|rtlsdr|hackrf|bladeRF|LimeSuite|iio|ad9361|liquid|usb' || true
            echo '--- unresolved linkage summary: ---'
            for mod in squashfs-root/usr/bin/modules/*.so; do ldd "$mod"; done 2>/dev/null | grep 'not found' | sort | uniq -c || true
      - store_artifacts:
          path: build/CubicSDR-x86_64.AppImage
workflows:
  version: 2
  build:
    jobs:
      - build:
          filters:
            tags:
              ignore: /.*/
      - appimage:
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /.*/
